x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./seed:/app/seed:ro
    logging: *logging

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/db_$$(date +%Y-%m-%d_%H%M).sql.gz
          if pg_dump --clean --if-exists -f /tmp/dump.sql; then
            gzip -c /tmp/dump.sql > "$$f" && rm -f /tmp/dump.sql && echo "Бэкап: $$f"
          else
            echo "Ошибка бэкапа"
          fi
          ls -1t /backups/db_*.sql.gz | tail -n +15 | xargs -r rm -f
          sleep 86400
        done
    logging: *logging

volumes:
  pgdata:
